# short feasibility check: real memory path (doc 512, n_ways 11, batch 4)
# from phase1/final — not the tiny smoke config, which hides oom.

[phase2]
model_name_or_path = "outputs/phase1/final"
output_dir = "outputs/phase2_feasibility"
run_name = "it-colbert-phase2-feasibility"
document_length = 512
query_length = 32
num_train_epochs = 1.0
per_device_train_batch_size = 4
learning_rate = 1.0e-5
warmup_ratio = 0.05
logging_steps = 1
save_steps = 40
save_total_limit = 1
seed = 42
bf16 = true
fp16 = false
compile_model = false
max_steps = 30
include_mmarco_hn = false
max_train_samples = 1024
kd_split_sampling = "proportional"
kd_split_min_share = 0.02
kd_n_ways = 11
ir_eval_enabled = false
kd_eval_samples = 0
eval_steps = 99999
per_device_eval_batch_size = 4
early_stopping_patience = 0
load_best_model_at_end = false
contrastive_anchor_enabled = false
auto_resume = false
