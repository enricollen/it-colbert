[phase2]
model_name_or_path = "outputs/phase1_doc256/final"
output_dir = "outputs/phase2_doc256"
run_name = "it-colbert-phase2-doc256"
document_length = 256
query_length = 32
num_train_epochs = 1.0
# kd encodes query + n_ways docs; trim vs doc180=16 for vram at len 256
per_device_train_batch_size = 12
learning_rate = 1.0e-5
warmup_ratio = 0.05
logging_steps = 20
save_steps = 500
save_total_limit = 2
seed = 42
bf16 = true
fp16 = false
compile_model = false
# keep same kd sample budget as doc180 run for a clean length ablation
max_train_samples = 80000
kd_eval_samples = 512
eval_steps = 2000
per_device_eval_batch_size = 32
early_stopping_patience = 3
load_best_model_at_end = true
metric_for_best_model = "kd-holdout_kl_divergence"
