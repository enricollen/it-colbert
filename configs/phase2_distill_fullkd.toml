[phase2]
model_name_or_path = "outputs/phase1/final"
output_dir = "outputs/phase2_fullkd"
run_name = "it-colbert-phase2-fullkd"
document_length = 180
query_length = 32
num_train_epochs = 1.0
# batch 16 saturates 3090 for kd (query + 11 docs @ doc180); fa2 did not help throughput here
per_device_train_batch_size = 16
learning_rate = 1.0e-5
warmup_ratio = 0.05
logging_steps = 50
save_steps = 2000
save_total_limit = 2
seed = 42
bf16 = true
fp16 = false
compile_model = false
# omit max_train_samples → use full lighton italian kd (~1.56m)
# kd hold-out for next runs (current fullkd started without it; do not restart)
kd_eval_samples = 512
eval_steps = 2000
per_device_eval_batch_size = 32
early_stopping_patience = 3
load_best_model_at_end = true
metric_for_best_model = "kd-holdout_kl_divergence"
