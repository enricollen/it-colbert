# short overrides for validating the pipeline on gpu before full train

[phase1]
mmarco_samples = 2048
mmarco_eval_samples = 128
include_wiki_hn = true
wiki_max_hard_negatives = 1
num_train_epochs = 1.0
per_device_train_batch_size = 16
per_device_eval_batch_size = 8
mini_batch_size = 4
max_steps = 20
eval_steps = 10
save_steps = 20
logging_steps = 5
output_dir = "outputs/smoke_phase1"
run_name = "it-colbert-smoke-phase1"

[phase2]
model_name_or_path = "outputs/smoke_phase1/final"
output_dir = "outputs/smoke_phase2"
run_name = "it-colbert-smoke-phase2"
per_device_train_batch_size = 2
max_steps = 10
max_train_samples = 256
kd_eval_samples = 32
eval_steps = 5
save_steps = 10
logging_steps = 2
