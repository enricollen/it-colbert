[phase2]
model_name_or_path = "outputs/phase1/final"
output_dir = "outputs/phase2_mixkd"
run_name = "it-colbert-phase2-mixkd"
document_length = 180
query_length = 32
num_train_epochs = 1.0
per_device_train_batch_size = 16
learning_rate = 1.0e-5
warmup_ratio = 0.05
logging_steps = 50
save_steps = 2000
save_total_limit = 2
seed = 42
bf16 = true
fp16 = false
compile_model = false

# mix: lighton kd (logits already ok from mxbai) + mmarco-it hn (bge probs → logit in loader)
# note: mmarco hn dataset != phase1 unicamp triples; see README "Phase 2 mixkd"
# max_train_samples = lighton budget only when include_mmarco_hn=true
include_mmarco_hn = true
max_train_samples = 400000
# omit mmarco_hn_max_samples → use full italian-hard-negatives (~370k)
mmarco_hn_dataset = "hotchpotch/mmarco-hard-negatives-reranker-filtered"
mmarco_hn_config = "italian-hard-negatives"
kd_n_ways = 11

kd_eval_samples = 512
eval_steps = 2000
per_device_eval_batch_size = 32
early_stopping_patience = 3
load_best_model_at_end = true
metric_for_best_model = "kd-holdout_kl_divergence"

# NOTE: this config reproduces a run from the published results table. it keeps
# the legacy sequential split budget, which spends max_train_samples entirely on
# msmarco_it (see README "KD split budget"). use configs/phase2_distill_v2.toml
# for the fixed proportional mixture.
kd_split_sampling = "sequential"