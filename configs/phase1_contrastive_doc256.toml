[phase1]
model_name = "DeepMount00/Italian-ModernBERT-base"
output_dir = "outputs/phase1_doc256"
run_name = "it-colbert-phase1-doc256"
dim = 128
document_length = 256
query_length = 32
mmarco_samples = 400000
mmarco_eval_samples = 1000
include_wiki_hn = true
wiki_max_hard_negatives = 2
num_train_epochs = 1.0
# slightly smaller than doc180=128 to keep 3090 headroom at longer seqs
per_device_train_batch_size = 96
per_device_eval_batch_size = 48
mini_batch_size = 96
learning_rate = 3.0e-6
temperature = 0.02
warmup_ratio = 0.05
logging_steps = 50
eval_steps = 1000
save_steps = 1000
save_total_limit = 2
seed = 42
bf16 = true
fp16 = false
compile_model = false
