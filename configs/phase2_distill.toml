[phase2]
model_name_or_path = "outputs/phase1/final"
output_dir = "outputs/phase2"
run_name = "it-colbert-phase2"
document_length = 180
query_length = 32
num_train_epochs = 1.0
# kd encodes query + n_ways docs; raise batch to use more vram
per_device_train_batch_size = 16
learning_rate = 1.0e-5
warmup_ratio = 0.05
logging_steps = 20
save_steps = 500
save_total_limit = 2
seed = 42
bf16 = true
fp16 = false
compile_model = false
# subsample of lighton italian kd (msmarco_it first); raise for longer runs
max_train_samples = 80000
# kd hold-out: kl student↔teacher on lighton rows never used in train (0=off)
kd_eval_samples = 512
eval_steps = 2000
per_device_eval_batch_size = 32
early_stopping_patience = 3
load_best_model_at_end = true
metric_for_best_model = "kd-holdout_kl_divergence"
