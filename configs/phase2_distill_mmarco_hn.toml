# ABLATION: phase 2 with the second teacher (mmarco hard negatives) enabled.
# run this only to measure whether the extra branch earns its complexity against
# configs/phase2_distill.toml. read that file's KD section first.
#
# phase 2 — KD over a genuinely mixed set, selected on retrieval metrics.
#
# background (see TODO.md 0.1): an earlier version of load_kd_italian drained the
# lighton splits in order, so any capped max_train_samples was spent entirely on
# msmarco_it. that made a run look like it had "more KD" when it really had
# different data, and produced the mistaken conclusion that KD scale drives
# long-document quality. the budget is now spread proportionally across splits.

[phase2]
model_name_or_path = "outputs/phase1/final"
output_dir = "outputs/phase2_mmarco_hn"
run_name = "it-colbert-phase2-mmarco-hn"
document_length = 512
query_length = 32
num_train_epochs = 1.0
# 32-way KD at length 512 is heavy; drop if VRAM complains (and keep the change
# in the run log — n_ways and batch size both move the effective negatives)
per_device_train_batch_size = 8
learning_rate = 1.0e-5
warmup_ratio = 0.05
logging_steps = 50
save_steps = 2000
save_total_limit = 3
seed = 42
bf16 = true
fp16 = false
compile_model = false

# --- KD mixture -------------------------------------------------------------
# ONE TEACHER. the mmarco hard-negative branch is off, on purpose:
#
# 1. it is scored by bge-reranker-v2-m3 while the lighton rows are scored by
#    mxbai-rerank-large-v2. two teachers in one KL loss means the student learns
#    an average of two different opinions about relevance. ColBERTv2, JaColBERT
#    and GTE-ModernColBERT all distil from a single teacher.
# 2. it is redundant. the lighton set already contains an `msmarco_it` split of
#    ~522k rows (~33% of the total) scored by the same mxbai teacher. mMARCO KD
#    was never missing — it only looked missing because the split-budget bug made
#    every capped run 100% msmarco_it, so the comparison was a generalist against
#    a specialist.
# 3. it costs a temperature you have to guess, and pads short rows with filler.
#
# to run it as an ablation, use configs/phase2_distill_mmarco_hn.toml.
include_mmarco_hn = true
max_train_samples = 600000
mmarco_hn_max_samples = 300000
mmarco_hn_dataset = "hotchpotch/mmarco-hard-negatives-reranker-filtered"
mmarco_hn_config = "italian-hard-negatives"

# bge probs -> logit(p) spans ~[-13.8, 13.8], softmaxing to a near one-hot target
# ~3x sharper than the lighton mxbai labels (~5-9). MEASURE this with
# scripts/inspect_kd_scores.py; 3.0 is a guess, not a measurement.
mmarco_hn_score_temperature = 3.0

# spend the lighton budget across every split instead of draining msmarco_it
kd_split_sampling = "proportional"
kd_split_min_share = 0.02

# VERIFY BEFORE RAISING. ColBERTv2 uses 32-64 ways, but that only helps if the
# dataset actually stores that many documents per query — otherwise the extra
# slots are padding and cost encoder passes for nothing. `inspect_kd_scores.py`
# prints the real documents-per-row; raise this only if it supports more.
kd_n_ways = 11

# --- checkpoint selection ---------------------------------------------------
# real retrieval metrics, not KL. fullkd picked its best-KL step while pooled
# mMARCO MRR@10 fell 0.491 -> 0.341; this makes that impossible to miss.
ir_eval_enabled = true
ir_eval_mldr_queries = 200
ir_eval_mldr_docs = 3000
ir_eval_mmarco_queries = 500
ir_eval_mmarco_docs = 5000
eval_steps = 2000
per_device_eval_batch_size = 32
early_stopping_patience = 4
load_best_model_at_end = true

# keep the KL curve alongside the IR metrics for overfitting diagnosis
kd_eval_samples = 512

# experimental replay stream; leave off for the first run so the KD mixture
# change is measured on its own
contrastive_anchor_enabled = false
contrastive_anchor_samples = 100000
